[project]
name = "cinesip-backend"
version = "0.1.0"
description = "CineSip backend — FastAPI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — real bugs, unused imports/names
    "I",    # isort — deterministic import order
    "UP",   # pyupgrade — modern syntax for our Python floor
    "B",    # bugbear — likely-wrong patterns
    "ASYNC",# async correctness (this app is async top to bottom)
]
ignore = [
    "E501",   # line length — the formatter owns wrapping, not the linter
    "B008",   # function call in default arg: this is how FastAPI Depends() works
]

[tool.ruff.lint.per-file-ignores]
# Deliberate broad excepts: an LLM/HTTP failure must degrade to fallback
# rules rather than take down a party game mid-movie.
"app/services/rule_generator.py" = ["BLE001", "S112"]

[tool.ruff.format]
quote-style = "double"
